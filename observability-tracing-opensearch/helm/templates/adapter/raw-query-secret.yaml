{{- /*
Credentials of the read-only OpenSearch user raw trace queries run as, unless
adapter.rawQuery.credentialsSecretName names an existing Secret. The password
is generated once and kept across upgrades. The setup job creates the user.
*/}}
{{- $rawQuery := .Values.adapter.rawQuery | default dict }}
{{- if and (eq (include "observability-tracing-opensearch.rawQueryEnabled" .) "true") (not $rawQuery.credentialsSecretName) }}
{{- $name := include "observability-tracing-opensearch.rawQuerySecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: tracing-adapter-opensearch
type: Opaque
data:
  username: {{ "openchoreo-traces-reader" | b64enc }}
  {{- if and $existing (index $existing.data "password") }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
